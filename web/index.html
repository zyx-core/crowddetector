<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowd Detection | AI Powered</title>
    <!-- updated path -->
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="overlay"></div>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-users-viewfinder"></i>
                <h1>Crowd<span>Sense</span></h1>
            </div>
            <div class="stat-item">
                <h3>Density</h3>
                <p id="density-value" class="value">Low</p>
            </div>
            <div class="stat-item">
                <button id="edit-zone-btn" class="secondary-btn"
                    style="padding: 5px; font-size: 0.8rem; background: rgba(0,0,0,0.3); margin-right: 5px;">
                    <i class="fa-solid fa-pen-to-square"></i> Edit Zone
                </button>
                <select id="entry-edge-select" class="secondary-btn" style="padding: 5px; font-size: 0.8rem; background: rgba(0,255,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.2); margin-right: 5px;">
                    <option value="left">Entry: Left</option>
                    <option value="right">Entry: Right</option>
                    <option value="top">Entry: Top</option>
                    <option value="bottom">Entry: Bottom</option>
                </select>
                <select id="exit-edge-select" class="secondary-btn" style="padding: 5px; font-size: 0.8rem; background: rgba(255,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.2); margin-right: 5px;">
                    <option value="right" selected>Exit: Right</option>
                    <option value="left">Exit: Left</option>
                    <option value="top">Exit: Top</option>
                    <option value="bottom">Exit: Bottom</option>
                </select>
                <button id="export-btn" class="secondary-btn"
                    style="padding: 5px; font-size: 0.8rem; background: rgba(0,255,100,0.2); margin-right: 5px;">
                    <i class="fa-solid fa-file-csv"></i> Export CSV
                </button>
                <button id="start-count-btn" class="action-btn glow" style="padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; background: rgba(0, 255, 100, 0.2); color: white; border: 1px solid rgba(0,255,100,0.5); margin-right: 5px; cursor: pointer;">
                    <i class="fa-solid fa-play"></i> Start Count
                </button>
                <button id="finish-count-btn" class="action-btn" style="padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; background: rgba(255, 0, 0, 0.2); color: white; border: 1px solid rgba(255,0,0,0.5); margin-right: 5px; cursor: pointer;">
                    <i class="fa-solid fa-stop"></i> Finish & Save
                </button>
                <select id="mode-select" class="secondary-btn"
                    style="padding: 5px; font-size: 0.8rem; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                    <option value="AUTO">Auto Mode</option>
                    <option value="INDIVIDUAL_TRACKING">Tracking (Boxes)</option>
                    <option value="SURGE_ESTIMATION">Surge (Heatmap)</option>
                </select>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Control Panel -->
            <div class="glass-panel controls">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="image">
                        <i class="fa-regular fa-image"></i> Image
                    </button>
                    <button class="tab-btn" data-tab="video">
                        <i class="fa-solid fa-video"></i> Video
                    </button>
                    <button class="tab-btn" data-tab="webcam">
                        <i class="fa-solid fa-camera"></i> Webcam
                    </button>
                </div>

                <!-- Image Tab -->
                <div id="image-tab" class="tab-content active">
                    <div class="upload-zone" id="image-drop-zone">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Drag & Drop or Click to Upload Image</p>
                        <input type="file" id="image-input" accept="image/*" hidden>
                    </div>
                </div>

                <!-- Video Tab -->
                <div id="video-tab" class="tab-content">
                    <div class="upload-zone" id="video-drop-zone">
                        <i class="fa-solid fa-film"></i>
                        <p>Drag & Drop or Click to Upload Video</p>
                        <input type="file" id="video-input" accept="video/*" hidden>
                    </div>
                </div>

                <!-- Webcam Tab -->
                <div id="webcam-tab" class="tab-content">
                    <p class="instruction">Use your local camera for real-time detection.</p>
                    <button class="action-btn glow" onclick="startWebcam()">
                        <i class="fa-solid fa-power-off"></i> Start Webcam
                    </button>
                </div>
            </div>

            <!-- Display Area -->
            <div class="glass-panel display-area">
                <div class="view-container" style="position: relative;">
                    <img id="result-display" src="" alt="Detection Result"
                        style="display: none; width: 100%; height: auto;">
                    <img id="video-stream" src="" alt="Video Stream" style="display: none; width: 100%; height: auto;">
                    <canvas id="tripwire-canvas"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                    <div id="placeholder-view">
                        <i class="fa-solid fa-eye-slash"></i>
                        <p>No Active Stream</p>
                    </div>
                </div>

                <!-- Stats Overlay -->
                <div class="stats-panel">
                    <div class="stat-item">
                        <span class="label">People In Room</span>
                        <span class="value" id="in-room-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">People Count</span>
                        <span class="value" id="count-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Density</span>
                        <span class="value" id="density-value">Low</span>
                    </div>
                </div>
            </div>

            <!-- Session History -->
            <div class="glass-panel" style="margin-top: 20px; padding: 20px;">
                <h3 style="margin: 0 0 15px 0; color: #fff; font-size: 1rem;"><i class="fa-solid fa-clock-rotate-left"></i> Session History</h3>
                <div style="max-height: 180px; overflow-y: auto;">
                    <table style="width: 100%; color: white; text-align: left; border-collapse: collapse; font-size: 0.85rem;">
                        <thead style="position: sticky; top: 0; background: rgba(15,23,42,0.9);">
                            <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                                <th style="padding: 5px;">Date</th>
                                <th style="padding: 5px;">Duration</th>
                                <th style="padding: 5px;">Total IN</th>
                                <th style="padding: 5px;">Total OUT</th>
                                <th style="padding: 5px;">Max In Room</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Live Graph -->
            <div class="glass-panel" style="margin-top: 20px; padding: 20px;">
                <h3 style="margin: 0 0 15px 0; color: #fff;">📊 Live Count History</h3>
                <canvas id="countChart" style="max-height: 250px;"></canvas>
            </div>
        </main>
    </div>

    <!-- updated path -->
    <script src="/static/app.js"></script>
</body>

</html>
